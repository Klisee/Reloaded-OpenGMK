name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "29"

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages and NDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Rust and cargo-ndk
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 aarch64-linux-android
          cargo +1.99.0 install cargo-ndk --version 3.5.4 --locked

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/src/OpenGMK

      - name: Build native engine
        working-directory: engine/src/OpenGMK
        run: cargo +1.99.0 ndk -t arm64-v8a --platform "${ANDROID_PLATFORM}" build -p gm8emulator --release --features backend-wgpu

      - name: Copy native library
        run: |
          install -D -m 0644 \
            engine/src/OpenGMK/target/aarch64-linux-android/release/libgm8emulator.so \
            androidApp/src/main/jniLibs/arm64-v8a/libgm8emulator.so
          file androidApp/src/main/jniLibs/arm64-v8a/libgm8emulator.so

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64, el APK se firmara con debug."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > androidApp/keystore.properties
          chmod 600 androidApp/keystore.properties

      - name: Build APK
        run: ./gradlew --no-daemon :androidApp:assembleRelease

      - name: Verify APK
        run: |
          APK="$(ls androidApp/build/outputs/apk/release/*.apk | head -1)"
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libgm8emulator.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reloaded-opengmk-android-arm64
          if-no-files-found: error
          retention-days: 30
          path: androidApp/build/outputs/apk/release/*.apk

      - name: Clean keystore
        if: always()
        run: rm -f androidApp/keystore.properties "$RUNNER_TEMP/keystore/release.jks"
