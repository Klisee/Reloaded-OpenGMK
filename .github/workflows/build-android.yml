name: Build Android

# Solo manual: ya no corre en cada push. Android es la plataforma que no se
# compila en este equipo, asi que sigue disponible desde la pestana Actions
# cuando haga falta un APK. Las versiones se publican con release.yml y un tag v*.
#
# Un APK por ABI (arm64-v8a, armeabi-v7a, x86_64) y un universal con las tres.
# Cada job compila solo su libgm8emulator.so con cargo-ndk y llama a Gradle con
# -PtargetAbi=<abi>; androidApp/build.gradle.kts traduce eso a abiFilters.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "29"
  CARGO_NDK_VERSION: "3.5.4"
  RUST_VERSION: "1.99.0"

jobs:
  build:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Los tres ABIs compilan en local con NDK 27.1 y Rust 1.99.0:
      #   armv7  -> ELF 32-bit LSB shared object, ARM, EABI5
      #   x86_64 -> ELF 64-bit LSB shared object, x86-64
      #   arm64  -> ELF 64-bit LSB shared object, ARM aarch64
      # Ninguna dependencia bloquea 32 bits: libffi solo entra en
      # cfg(all(target_os = "windows", target_arch = "x86")) y nunca se compila
      # en Android; clipboard usa nop_clipboard en Android (no arrastra xcb);
      # wgpu 30 y lzzzz compilan para armv7 con el backend GLES. Por eso ningun
      # ABI lleva continue-on-error: si uno falla, debe verse en rojo.
      matrix:
        include:
          - abi: arm64-v8a
            rust: aarch64-linux-android
          - abi: armeabi-v7a
            rust: armv7-linux-androideabi
          - abi: x86_64
            rust: x86_64-linux-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar SDK y NDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Rust y cargo-ndk
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup target add --toolchain "${RUST_VERSION}" "${{ matrix.rust }}"
          cargo +"${RUST_VERSION}" install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/src/OpenGMK
          key: ${{ matrix.abi }}

      - name: Compilar motor nativo
        working-directory: engine/src/OpenGMK
        run: cargo +"${RUST_VERSION}" ndk -t "${{ matrix.abi }}" --platform "${ANDROID_PLATFORM}" build -p gm8emulator --release --features backend-wgpu

      - name: Copiar biblioteca nativa
        run: |
          set -euo pipefail
          SO="engine/src/OpenGMK/target/${{ matrix.rust }}/release/libgm8emulator.so"
          test -s "$SO"
          install -D -m 0644 "$SO" "androidApp/src/main/jniLibs/${{ matrix.abi }}/libgm8emulator.so"

      - name: Verificar ELF
        run: |
          set -euo pipefail
          SO="androidApp/src/main/jniLibs/${{ matrix.abi }}/libgm8emulator.so"
          case "${{ matrix.abi }}" in
            arm64-v8a)   expected="ARM aarch64" ;;
            armeabi-v7a) expected="ARM, EABI5" ;;
            x86_64)      expected="x86-64" ;;
          esac
          file "$SO"
          desc="$(file "$SO")"
          case "$desc" in
            *"$expected"*) ;;
            *)
              echo "::error::$SO no es ${{ matrix.abi }} (se esperaba '$expected')"
              exit 1
              ;;
          esac
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$SO" | grep -E 'Class:|Machine:'

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64, el APK se firmara con debug."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > androidApp/keystore.properties
          chmod 600 androidApp/keystore.properties

      - name: Compilar APK
        run: ./gradlew --no-daemon :androidApp:assembleRelease -PtargetAbi=${{ matrix.abi }}

      - name: Verificar APK
        run: |
          set -euo pipefail
          APK="$(ls androidApp/build/outputs/apk/release/*.apk | head -1)"
          test -s "$APK"
          echo "APK: $APK"
          # La lista se guarda antes de filtrar: unzip | grep -q con pipefail
          # puede morir por SIGPIPE cuando grep acierta y cierra el pipe.
          unzip -l "$APK" > apk-listing.txt
          grep -E 'lib/[^/]+/libgm8emulator\.so' apk-listing.txt
          # Un APK por ABI debe llevar exactamente esa lib y ninguna otra.
          count="$(grep -cE 'lib/[^/]+/libgm8emulator\.so' apk-listing.txt || true)"
          test "$count" -eq 1 || {
            echo "::error::El APK deberia llevar 1 lib (${{ matrix.abi }}) y lleva $count"
            exit 1
          }
          grep -q "lib/${{ matrix.abi }}/libgm8emulator.so" apk-listing.txt
          mkdir -p dist
          cp "$APK" "dist/reloaded-opengmk-${{ matrix.abi }}.apk"
          ls -la dist

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: reloaded-opengmk-${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 30
          path: dist/reloaded-opengmk-${{ matrix.abi }}.apk

      - name: Subir biblioteca nativa
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 7
          path: androidApp/src/main/jniLibs/${{ matrix.abi }}/libgm8emulator.so

      - name: Limpiar keystore
        if: always()
        run: rm -f androidApp/keystore.properties "$RUNNER_TEMP/keystore/release.jks"

  universal:
    name: Android universal
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar SDK y NDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # download-artifact conserva la estructura del artefacto; se busca el .so
      # y se instala en su carpeta para no depender de como quedo la raiz.
      - name: Descargar bibliotecas nativas
        uses: actions/download-artifact@v4
        with:
          pattern: native-lib-*
          path: native-libs

      - name: Colocar bibliotecas en jniLibs
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$(find "native-libs/native-lib-$abi" -name libgm8emulator.so -type f | head -1)"
            test -n "$src" || {
              echo "::error::El artefacto native-lib-$abi no trae libgm8emulator.so"
              exit 1
            }
            install -D -m 0644 "$src" "androidApp/src/main/jniLibs/$abi/libgm8emulator.so"
          done
          ls -lR androidApp/src/main/jniLibs

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64, el APK se firmara con debug."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > androidApp/keystore.properties
          chmod 600 androidApp/keystore.properties

      - name: Compilar APK universal
        run: ./gradlew --no-daemon :androidApp:assembleRelease -PtargetAbi=universal

      - name: Verificar APK universal
        run: |
          set -euo pipefail
          APK="$(ls androidApp/build/outputs/apk/release/*.apk | head -1)"
          test -s "$APK"
          echo "APK: $APK"
          unzip -l "$APK" > apk-listing.txt
          grep -E 'lib/[^/]+/libgm8emulator\.so' apk-listing.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -q "lib/$abi/libgm8emulator.so" apk-listing.txt || {
              echo "::error::Falta lib/$abi/libgm8emulator.so en el APK universal"
              exit 1
            }
          done
          count="$(grep -cE 'lib/[^/]+/libgm8emulator\.so' apk-listing.txt || true)"
          test "$count" -eq 3 || {
            echo "::error::El APK universal deberia llevar 3 libs y lleva $count"
            exit 1
          }
          mkdir -p dist
          cp "$APK" dist/reloaded-opengmk-universal.apk
          ls -la dist

      - name: Subir APK universal
        uses: actions/upload-artifact@v4
        with:
          name: reloaded-opengmk-universal
          if-no-files-found: error
          retention-days: 30
          path: dist/reloaded-opengmk-universal.apk

      - name: Limpiar keystore
        if: always()
        run: rm -f androidApp/keystore.properties "$RUNNER_TEMP/keystore/release.jks"

  verify:
    name: Verificar APKs
    needs: [build, universal]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Descargar APKs
        uses: actions/download-artifact@v4
        with:
          pattern: reloaded-opengmk-*
          merge-multiple: true
          path: dist

      - name: Comprobar contenido por ABI
        run: |
          set -euo pipefail
          ls -la dist
          check() {
            abi="$1"
            apk="dist/reloaded-opengmk-${abi}.apk"
            test -s "$apk" || { echo "::error::Falta $apk"; exit 1; }
            echo "== $apk"
            unzip -l "$apk" > apk-listing.txt
            grep -E 'lib/[^/]+/libgm8emulator\.so' apk-listing.txt
            grep -q "lib/${abi}/libgm8emulator.so" apk-listing.txt || {
              echo "::error::$apk no contiene lib/${abi}/libgm8emulator.so"
              exit 1
            }
            # El ELF empaquetado debe ser del ABI correcto, no solo la ruta.
            unzip -p "$apk" "lib/${abi}/libgm8emulator.so" > apk-lib.so
            case "$abi" in
              arm64-v8a)   expected="ARM aarch64" ;;
              armeabi-v7a) expected="ARM, EABI5" ;;
              x86_64)      expected="x86-64" ;;
            esac
            file apk-lib.so
            desc="$(file apk-lib.so)"
            case "$desc" in
              *"$expected"*) ;;
              *)
                echo "::error::La lib de $apk no es $abi (se esperaba '$expected')"
                exit 1
                ;;
            esac
          }
          check arm64-v8a
          check armeabi-v7a
          check x86_64
          universal="dist/reloaded-opengmk-universal.apk"
          test -s "$universal" || { echo "::error::Falta $universal"; exit 1; }
          unzip -l "$universal" > universal-listing.txt
          grep -E 'lib/[^/]+/libgm8emulator\.so' universal-listing.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -q "lib/$abi/libgm8emulator.so" universal-listing.txt || {
              echo "::error::El universal no contiene lib/$abi/libgm8emulator.so"
              exit 1
            }
          done
          echo "Todos los APKs llevan la lib de su ABI."
