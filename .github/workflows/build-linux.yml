name: Build Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libudev-dev \
            libdbus-1-dev libssl-dev libfontconfig1-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/src/OpenGMK

      - name: Build engine
        run: |
          cargo build --manifest-path engine/src/OpenGMK/Cargo.toml --release -p gm8emulator --features backend-wgpu
          install -m 0755 engine/src/OpenGMK/target/release/gm8emulator \
            desktopApp/src/main/resources/gm8emulator

      - name: Verify engine
        run: |
          file desktopApp/src/main/resources/gm8emulator
          test -s desktopApp/src/main/resources/gm8emulator

      - name: Package .deb
        run: ./gradlew --no-daemon :desktopApp:packageDeb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: reloaded-opengmk-linux-x64
          if-no-files-found: error
          retention-days: 30
          path: desktopApp/build/compose/binaries/main/deb/*.deb
