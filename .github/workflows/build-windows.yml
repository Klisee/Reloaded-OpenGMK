name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/src/OpenGMK

      - name: Build engine
        shell: pwsh
        run: |
          cargo build --manifest-path engine/src/OpenGMK/Cargo.toml --release -p gm8emulator --features backend-wgpu
          Copy-Item engine/src/OpenGMK/target/release/gm8emulator.exe desktopApp/src/main/resources/gm8emulator.exe -Force

      - name: Verify engine
        shell: pwsh
        run: |
          $exe = "desktopApp/src/main/resources/gm8emulator.exe"
          if (-not (Test-Path $exe)) { throw "no se genero el motor" }
          Get-Item $exe | Select-Object Name, Length

      - name: Package Windows app
        shell: pwsh
        run: .\gradlew.bat --no-daemon :desktopApp:packageMsi :desktopApp:packageNsis

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: reloaded-opengmk-windows
          if-no-files-found: error
          retention-days: 30
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/nsis/*.exe
