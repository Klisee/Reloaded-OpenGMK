<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Pokémon Reloaded</title>
  <desc id="d">Icono de app: pokebola naranja y blanca sobre recuadro gris claro, marco gris oscuro y borde negro.</desc>

  <defs>
    <!-- Marco gris oscuro -->
    <linearGradient id="frameDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55575c"/>
      <stop offset="0.5" stop-color="#3a3b3f"/>
      <stop offset="1" stop-color="#26272a"/>
    </linearGradient>

    <!-- Recuadro gris claro -->
    <radialGradient id="plate" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#d9dce0"/>
      <stop offset="0.6" stop-color="#b3b7bd"/>
      <stop offset="1" stop-color="#8a8e95"/>
    </radialGradient>

    <!-- Mitad superior naranja -->
    <linearGradient id="orange" x1="0.25" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="0.45" stop-color="#ff7d1f"/>
      <stop offset="1" stop-color="#d94f08"/>
    </linearGradient>

    <!-- Mitad inferior blanca -->
    <linearGradient id="white" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e3e6ea"/>
      <stop offset="1" stop-color="#b4b9c1"/>
    </linearGradient>

    <!-- Sombreado esférico (oscurece hacia el borde) -->
    <radialGradient id="shade" cx="50%" cy="50%" r="50%">
      <stop offset="0.62" stop-color="#1a0a02" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#1a0a02" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#120804" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Brillo superior -->
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Botón central -->
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c7cd"/>
      <stop offset="1" stop-color="#6c7077"/>
    </linearGradient>
    <radialGradient id="btn" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f1f3f5"/>
      <stop offset="1" stop-color="#c9cdd3"/>
    </radialGradient>

    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="146"/>
    </clipPath>

    <filter id="ballShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. Borde negro -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#000000"/>

  <!-- 2. Marco gris oscuro -->
  <rect x="14" y="14" width="484" height="484" rx="92" fill="url(#frameDark)"/>
  <rect x="15.5" y="15.5" width="481" height="481" rx="90.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- 3. Recuadro gris claro -->
  <rect x="50" y="50" width="412" height="412" rx="64" fill="#1d1e21"/>
  <rect x="54" y="54" width="404" height="404" rx="60" fill="url(#plate)"/>
  <rect x="55.5" y="55.5" width="401" height="401" rx="58.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- 4. Pokebola -->
  <g filter="url(#ballShadow)">
    <circle cx="256" cy="256" r="152" fill="#17181b"/>
  </g>

  <g clip-path="url(#ballClip)">
    <!-- Mitades -->
    <rect x="100" y="100" width="312" height="156" fill="url(#orange)"/>
    <rect x="100" y="256" width="312" height="156" fill="url(#white)"/>

    <!-- Sombreado esférico -->
    <circle cx="256" cy="256" r="146" fill="url(#shade)"/>

    <!-- Brillo curvo en la mitad naranja -->
    <path d="M142 214 C148 160 196 118 262 112 C214 128 176 162 164 214 Z" fill="url(#gloss)" opacity="0.8"/>

    <!-- Reflejo suave en la mitad blanca -->
    <path d="M338 330 C326 362 296 384 262 392 C300 382 328 360 344 326 Z" fill="#ffffff" opacity="0.55"/>

    <!-- Banda central -->
    <rect x="100" y="238" width="312" height="36" fill="#1b1c20"/>
    <rect x="100" y="238" width="312" height="3" fill="#ffffff" fill-opacity="0.12"/>
  </g>

  <!-- Contorno de la bola -->
  <circle cx="256" cy="256" r="146" fill="none" stroke="#17181b" stroke-width="8"/>

  <!-- Botón central -->
  <circle cx="256" cy="256" r="52" fill="#17181b"/>
  <circle cx="256" cy="256" r="42" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="29" fill="#2a2c31"/>
  <circle cx="256" cy="256" r="25" fill="url(#btn)"/>
  <ellipse cx="247" cy="246" rx="10" ry="6" fill="#ffffff" opacity="0.9" transform="rotate(-30 247 246)"/>
</svg>
